<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-label="Азот и фосфор — элементы VA группы, у обоих 5 электронов на внешнем слое. Азот: степени окисления от −3 до +5, в природе — воздух и селитры; применение — аммиак, удобрения. Фосфор: степени окисления −3, 0, +3, +5, в природе — фосфориты, апатиты, кости; применение — удобрения, спички. От азота к фосфору растут число слоёв, радиус и восстановительные свойства, уменьшаются электроотрицательность, окислительные и неметаллические свойства">
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<rect width="760" height="356" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="700" fill="#1f2433">Азот и фосфор — VA группа</text>
<text x="20" y="50" font-size="12" fill="#6b7387">У обоих атомов 5 электронов на внешнем слое</text>

<g>
<rect x="20" y="66" width="220" height="274" rx="14" fill="#f2f3ff" stroke="#dcdff7" stroke-width="1.5"/>
<text x="130" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Азот</text>
<circle cx="130" cy="145" r="32" fill="#9fa8ff"/>
<text x="130" y="154" text-anchor="middle" font-size="25" font-weight="700" fill="#16205a">N</text>
<text x="130" y="207" text-anchor="middle" font-size="12" fill="#3a4056">электроны: 2, 5</text>
<rect x="40" y="219" width="180" height="24" rx="12" fill="#e2e5ff"/>
<text x="130" y="235" text-anchor="middle" font-size="11.5" font-weight="600" fill="#262d7a">с. о.: от −3 до +5</text>
<text x="36" y="268" font-size="10.5" font-weight="600" fill="#8a91a3">В ПРИРОДЕ</text>
<text x="36" y="284" font-size="11.5" fill="#1f2433">воздух (78 %), селитры, белки</text>
<text x="36" y="308" font-size="10.5" font-weight="600" fill="#8a91a3">ПРИМЕНЕНИЕ</text>
<text x="36" y="324" font-size="11.5" fill="#1f2433">аммиак, удобрения</text>
</g>

<g>
<rect x="255" y="66" width="220" height="274" rx="14" fill="#fff5ec" stroke="#f5dfca" stroke-width="1.5"/>
<text x="365" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Фосфор</text>
<circle cx="365" cy="145" r="42" fill="#f4b183"/>
<text x="365" y="154" text-anchor="middle" font-size="25" font-weight="700" fill="#4a2108">P</text>
<text x="365" y="207" text-anchor="middle" font-size="12" fill="#3a4056">электроны: 2, 8, 5</text>
<rect x="275" y="219" width="180" height="24" rx="12" fill="#fde3cd"/>
<text x="365" y="235" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b3410">с. о.: −3, 0, +3, +5</text>
<text x="271" y="268" font-size="10.5" font-weight="600" fill="#8a91a3">В ПРИРОДЕ</text>
<text x="271" y="284" font-size="11.5" fill="#1f2433">фосфориты, апатиты, кости</text>
<text x="271" y="308" font-size="10.5" font-weight="600" fill="#8a91a3">ПРИМЕНЕНИЕ</text>
<text x="271" y="324" font-size="11.5" fill="#1f2433">удобрения, спички</text>
</g>

<g>
<rect x="490" y="66" width="250" height="274" rx="14" fill="#fafbfd" stroke="#e6e9f0" stroke-width="1.5"/>
<text x="508" y="94" font-size="13" font-weight="700" fill="#1f2433">От N к P</text>
<text x="508" y="124" font-size="12.5" fill="#0f7c69">↑ число электронных слоёв</text>
<text x="508" y="149" font-size="12.5" fill="#0f7c69">↑ радиус атома</text>
<text x="508" y="174" font-size="12.5" fill="#0f7c69">↑ восстановительные свойства</text>
<text x="508" y="199" font-size="12.5" fill="#b3282d">↓ электроотрицательность</text>
<text x="508" y="224" font-size="12.5" fill="#b3282d">↓ окислительные свойства</text>
<text x="508" y="249" font-size="12.5" fill="#b3282d">↓ неметаллические свойства</text>
<line x1="508" y1="268" x2="722" y2="268" stroke="#e6e9f0" stroke-width="1.5"/>
<text x="508" y="292" font-size="11.5" fill="#6b7387">Оба — неметаллы.</text>
<text x="508" y="310" font-size="11.5" fill="#6b7387">Но N₂ малоактивен: мешает</text>
<text x="508" y="328" font-size="11.5" fill="#6b7387">прочная тройная связь N≡N.</text>
</g>
</svg>
