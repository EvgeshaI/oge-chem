<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Азот и фосфор — элементы VA группы. У обоих 5 электронов на внешнем слое. От азота к фосфору радиус растёт, электроотрицательность и окислительные свойства уменьшаются">
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<rect width="760" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="800" fill="#1f2433">Азот и фосфор — VA группа (пниктогены)</text>
<text x="20" y="50" font-size="12" fill="#6b7387">На внешнем слое 5 электронов (ns²np³). Размер круга — условный размер атома</text>
<g>
<rect x="20" y="66" width="220" height="250" rx="14" fill="#eef0ff" stroke="#c9cdf5" stroke-width="2"/>
<text x="36" y="88" font-size="12" font-weight="800" fill="#4b52b8">7</text>
<circle cx="130" cy="140" r="37" fill="#9fa8ff" stroke="#5b63c9" stroke-width="3"/>
<text x="130" y="150" text-anchor="middle" font-size="28" font-weight="800" fill="#16205a">N</text>
<text x="130" y="206" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2433">азот · Z = 7</text>
<text x="130" y="226" text-anchor="middle" font-size="12" fill="#1f2433">2-й период · 2ē 5ē</text>
<text x="130" y="244" text-anchor="middle" font-size="12" fill="#1f2433">ЭО 3,04 · r 75 пм</text>
<rect x="34" y="256" width="192" height="26" rx="13" fill="#d9dcff"/>
<text x="130" y="273" text-anchor="middle" font-size="11" font-weight="800" fill="#262d7a">с. о.: от −3 до +5</text>
<text x="130" y="304" text-anchor="middle" font-size="11" fill="#6b7387">простое вещество: N₂ (N≡N)</text>
</g>
<g>
<rect x="255" y="66" width="220" height="250" rx="14" fill="#fff1e6" stroke="#f1cfae" stroke-width="2"/>
<text x="271" y="88" font-size="12" font-weight="800" fill="#a35a1c">15</text>
<circle cx="365" cy="140" r="50" fill="#f4b183" stroke="#b8702f" stroke-width="3"/>
<text x="365" y="150" text-anchor="middle" font-size="28" font-weight="800" fill="#4a2108">P</text>
<text x="365" y="206" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2433">фосфор · Z = 15</text>
<text x="365" y="226" text-anchor="middle" font-size="12" fill="#1f2433">3-й период · 2ē 8ē 5ē</text>
<text x="365" y="244" text-anchor="middle" font-size="12" fill="#1f2433">ЭО 2,19 · r 110 пм</text>
<rect x="269" y="256" width="192" height="26" rx="13" fill="#fbd9bd"/>
<text x="365" y="273" text-anchor="middle" font-size="11" font-weight="800" fill="#6b3410">с. о.: −3, 0, +3, +5</text>
<text x="365" y="304" text-anchor="middle" font-size="11" fill="#6b7387">белый P₄, красный, чёрный фосфор</text>
</g>
<g>
<rect x="490" y="66" width="250" height="250" rx="14" fill="#f4f6fb" stroke="#e1e5f0" stroke-width="2"/>
<text x="506" y="92" font-size="13" font-weight="800" fill="#1f2433">От N к P (сверху вниз):</text>
<text x="506" y="122" font-size="13" font-weight="800" fill="#0f7c69">▲ число электронных слоёв</text>
<text x="506" y="148" font-size="13" font-weight="800" fill="#0f7c69">▲ радиус атома</text>
<text x="506" y="174" font-size="13" font-weight="800" fill="#0f7c69">▲ восстановительные свойства</text>
<text x="506" y="200" font-size="13" font-weight="800" fill="#b3282d">▼ электроотрицательность</text>
<text x="506" y="226" font-size="13" font-weight="800" fill="#b3282d">▼ окислительные свойства</text>
<text x="506" y="252" font-size="13" font-weight="800" fill="#b3282d">▼ неметаллические свойства</text>
<text x="506" y="282" font-size="11" fill="#6b7387">Но простое вещество N₂ менее</text>
<text x="506" y="298" font-size="11" fill="#6b7387">активно, чем P: мешает связь N≡N</text>
</g>
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="30" y1="346" x2="720" y2="346" stroke="#16a58c" stroke-width="4"/>
<polyline points="708,338 722,346 708,354" stroke="#16a58c" stroke-width="4"/>
</g>
<text x="30" y="336" font-size="11.5" font-weight="800" fill="#0f7c69">общее: 5 внешних ē · не хватает 3 ē до восьми · низшая с. о. −3, высшая +5 · неметаллы</text>
<text x="30" y="374" font-size="11.5" font-weight="800" fill="#b3282d">различие: у фосфора есть свободный 3d-подуровень → валентность III и V; у азота — не больше IV</text>
<text x="30" y="394" font-size="10.5" fill="#6b7387">В VA группу входят также As, Sb, Bi; в ОГЭ строение атомов изучают только у первых 20 элементов</text>
</svg>
