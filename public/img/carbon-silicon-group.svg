<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-label="Углерод и кремний — элементы IVA группы, у обоих 4 электрона на внешнем слое. Углерод: степени окисления −4, 0, +2, +4, в природе — алмаз, графит, уголь, нефть; применение — топливо, металлургия, электроды. Кремний: степени окисления −4, 0, +4, в природе только в соединениях — песок, глина; применение — микросхемы, солнечные батареи. От углерода к кремнию растут число слоёв, радиус и восстановительные свойства, уменьшаются электроотрицательность и неметаллические свойства">
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<rect width="760" height="356" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="700" fill="#1f2433">Углерод и кремний — IVA группа</text>
<text x="20" y="50" font-size="12" fill="#6b7387">У обоих атомов 4 электрона на внешнем слое</text>

<g>
<rect x="20" y="66" width="220" height="274" rx="14" fill="#f3f4f8" stroke="#dde1ea" stroke-width="1.5"/>
<text x="130" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Углерод</text>
<circle cx="130" cy="145" r="32" fill="#3a4056"/>
<text x="130" y="154" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">C</text>
<text x="130" y="207" text-anchor="middle" font-size="12" fill="#3a4056">электроны: 2, 4</text>
<rect x="40" y="219" width="180" height="24" rx="12" fill="#e3e6ef"/>
<text x="130" y="235" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2433">с. о.: −4, 0, +2, +4</text>
<text x="36" y="268" font-size="10.5" font-weight="600" fill="#8a91a3">В ПРИРОДЕ</text>
<text x="36" y="284" font-size="11.5" fill="#1f2433">алмаз, графит, уголь, нефть</text>
<text x="36" y="308" font-size="10.5" font-weight="600" fill="#8a91a3">ПРИМЕНЕНИЕ</text>
<text x="36" y="324" font-size="11.5" fill="#1f2433">топливо, металлургия, электроды</text>
</g>

<g>
<rect x="255" y="66" width="220" height="274" rx="14" fill="#f0f4fb" stroke="#d6dfee" stroke-width="1.5"/>
<text x="365" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Кремний</text>
<circle cx="365" cy="145" r="42" fill="#8ea3c4"/>
<text x="365" y="154" text-anchor="middle" font-size="25" font-weight="700" fill="#14213d">Si</text>
<text x="365" y="207" text-anchor="middle" font-size="12" fill="#3a4056">электроны: 2, 8, 4</text>
<rect x="275" y="219" width="180" height="24" rx="12" fill="#dce4f2"/>
<text x="365" y="235" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14213d">с. о.: −4, 0, +4</text>
<text x="271" y="268" font-size="10.5" font-weight="600" fill="#8a91a3">В ПРИРОДЕ</text>
<text x="271" y="284" font-size="11.5" fill="#1f2433">только соединения: песок, глина</text>
<text x="271" y="308" font-size="10.5" font-weight="600" fill="#8a91a3">ПРИМЕНЕНИЕ</text>
<text x="271" y="324" font-size="11.5" fill="#1f2433">микросхемы, солнечные батареи</text>
</g>

<g>
<rect x="490" y="66" width="250" height="274" rx="14" fill="#fafbfd" stroke="#e6e9f0" stroke-width="1.5"/>
<text x="508" y="94" font-size="13" font-weight="700" fill="#1f2433">От C к Si</text>
<text x="508" y="128" font-size="12.5" fill="#0f7c69">↑ число электронных слоёв</text>
<text x="508" y="156" font-size="12.5" fill="#0f7c69">↑ радиус атома</text>
<text x="508" y="184" font-size="12.5" fill="#0f7c69">↑ восстановительные свойства</text>
<text x="508" y="212" font-size="12.5" fill="#b3282d">↓ электроотрицательность</text>
<text x="508" y="240" font-size="12.5" fill="#b3282d">↓ неметаллические свойства</text>
<line x1="508" y1="262" x2="722" y2="262" stroke="#e6e9f0" stroke-width="1.5"/>
<text x="508" y="288" font-size="11.5" fill="#6b7387">Оба — неметаллы.</text>
<text x="508" y="306" font-size="11.5" fill="#6b7387">Углерод — основа живой природы,</text>
<text x="508" y="324" font-size="11.5" fill="#6b7387">кремний — горных пород.</text>
</g>
</svg>
