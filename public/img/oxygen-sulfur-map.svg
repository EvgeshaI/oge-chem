<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Карта реакций кислорода и серы. Кислород реагирует с металлами (кроме золота и платины), неметаллами и сложными веществами, не реагирует с галогенами. Сера реагирует с металлами и водородом как окислитель, с кислородом и концентрированными кислотами-окислителями как восстановитель, не реагирует с водой и разбавленными кислотами">
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<rect width="760" height="430" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="800" fill="#1f2433">С чем реагируют кислород и сера</text>
<text x="20" y="50" font-size="12" fill="#6b7387">Зелёный — реакция идёт, красный — не идёт; t — при нагревании</text>
<!-- КИСЛОРОД -->
<g stroke-width="4" stroke-linecap="round">
<line x1="190" y1="230" x2="80" y2="110" stroke="#16a58c"/>
<line x1="190" y1="230" x2="300" y2="110" stroke="#16a58c"/>
<line x1="190" y1="230" x2="70" y2="340" stroke="#16a58c"/>
<line x1="190" y1="230" x2="310" y2="350" stroke="#e5484d" stroke-dasharray="8 6"/>
</g>
<circle cx="190" cy="230" r="44" fill="#ff8a8a" stroke="#c94b4b" stroke-width="3"/>
<text x="190" y="240" text-anchor="middle" font-size="26" font-weight="800" fill="#4a0f14">O₂</text>
<g>
<rect x="14" y="70" width="140" height="62" rx="10" fill="#e3f6ef"/>
<text x="84" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f7c69">металлы → оксиды</text>
<text x="84" y="107" text-anchor="middle" font-size="11" fill="#1f2433">MgO, Al₂O₃, CuO (t)</text>
<text x="84" y="123" text-anchor="middle" font-size="11" fill="#1f2433">Fe → Fe₃O₄, Na → Na₂O₂</text>
</g>
<g>
<rect x="232" y="70" width="150" height="62" rx="10" fill="#e3f6ef"/>
<text x="307" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f7c69">неметаллы → оксиды</text>
<text x="307" y="107" text-anchor="middle" font-size="11" fill="#1f2433">H₂O, SO₂, CO₂, P₂O₅</text>
<text x="307" y="123" text-anchor="middle" font-size="11" fill="#1f2433">N₂ → NO (разряд)</text>
</g>
<g>
<rect x="8" y="310" width="160" height="62" rx="10" fill="#e3f6ef"/>
<text x="88" y="330" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f7c69">сложные вещества</text>
<text x="88" y="347" text-anchor="middle" font-size="11" fill="#1f2433">CH₄, H₂S, NH₃, CO, NO</text>
<text x="88" y="363" text-anchor="middle" font-size="11" fill="#1f2433">→ оксиды элементов</text>
</g>
<g>
<rect x="234" y="330" width="150" height="62" rx="10" fill="#fde8e8"/>
<text x="309" y="350" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b3282d">не реагирует</text>
<text x="309" y="367" text-anchor="middle" font-size="11" fill="#1f2433">Cl₂, Br₂, I₂, Au, Pt,</text>
<text x="309" y="383" text-anchor="middle" font-size="11" fill="#1f2433">благородные газы</text>
</g>
<!-- разделитель -->
<line x1="398" y1="70" x2="398" y2="400" stroke="#e1e5f0" stroke-width="2"/>
<!-- СЕРА -->
<g stroke-width="4" stroke-linecap="round">
<line x1="580" y1="230" x2="470" y2="110" stroke="#16a58c"/>
<line x1="580" y1="230" x2="690" y2="110" stroke="#16a58c"/>
<line x1="580" y1="230" x2="470" y2="350" stroke="#f0a030"/>
<line x1="580" y1="230" x2="690" y2="350" stroke="#e5484d" stroke-dasharray="8 6"/>
</g>
<circle cx="580" cy="230" r="44" fill="#f7d94c" stroke="#b89b12" stroke-width="3"/>
<text x="580" y="240" text-anchor="middle" font-size="26" font-weight="800" fill="#4a3b00">S</text>
<g>
<rect x="408" y="70" width="140" height="62" rx="10" fill="#e3f6ef"/>
<text x="478" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f7c69">металлы (t)</text>
<text x="478" y="107" text-anchor="middle" font-size="11" fill="#1f2433">FeS, ZnS, Al₂S₃, Na₂S</text>
<text x="478" y="123" text-anchor="middle" font-size="11" fill="#1f2433">Hg — без нагревания</text>
</g>
<g>
<rect x="612" y="70" width="140" height="62" rx="10" fill="#e3f6ef"/>
<text x="682" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f7c69">водород (t)</text>
<text x="682" y="107" text-anchor="middle" font-size="11" fill="#1f2433">H₂ + S → H₂S</text>
<text x="682" y="123" text-anchor="middle" font-size="11" fill="#1f2433">S⁰ → S⁻²</text>
</g>
<g>
<rect x="404" y="310" width="160" height="78" rx="10" fill="#fff0de"/>
<text x="484" y="330" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b8740a">O₂, конц. H₂SO₄,</text>
<text x="484" y="346" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b8740a">конц. HNO₃</text>
<text x="484" y="363" text-anchor="middle" font-size="11" fill="#1f2433">S⁰ → S⁺⁴ (SO₂), S⁺⁶</text>
<text x="484" y="379" text-anchor="middle" font-size="11" fill="#1f2433">сера — восстановитель</text>
</g>
<g>
<rect x="608" y="330" width="146" height="62" rx="10" fill="#fde8e8"/>
<text x="681" y="350" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b3282d">не реагирует</text>
<text x="681" y="367" text-anchor="middle" font-size="11" fill="#1f2433">H₂O, разб. HCl, H₂SO₄,</text>
<text x="681" y="383" text-anchor="middle" font-size="11" fill="#1f2433">N₂, Au, Pt</text>
</g>
<text x="580" y="420" text-anchor="middle" font-size="12" font-weight="800" fill="#5c4d00">сера — и окислитель, и восстановитель</text>
<text x="190" y="420" text-anchor="middle" font-size="12" font-weight="800" fill="#7a1d22">кислород — всегда окислитель</text>
</svg>
