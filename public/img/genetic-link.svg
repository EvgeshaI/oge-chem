<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Генетическая связь классов: металл кальций, оксид кальция, гидроксид кальция; неметалл сера, оксид серы(IV), сернистая кислота; основание и кислота, а также основный и кислотный оксиды дают соль — сульфит кальция">
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a91a3"/></marker>
</defs>
<rect width="760" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="700" fill="#1f2433">Генетическая связь классов</text>
<text x="20" y="50" font-size="12" fill="#6b7387">Из металла и неметалла получаются «свои» ряды веществ — и встречаются они в соли</text>

<g>
<rect x="20" y="75" width="150" height="62" rx="14" fill="#eaf1fd" stroke="#bcd0f1" stroke-width="1.5"/>
<text x="95" y="96" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a91a3">МЕТАЛЛ</text>
<text x="95" y="123" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2433">Ca</text>
<rect x="215" y="75" width="150" height="62" rx="14" fill="#eaf1fd" stroke="#bcd0f1" stroke-width="1.5"/>
<text x="290" y="96" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a91a3">ОСНОВНЫЙ ОКСИД</text>
<text x="290" y="123" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2433">CaO</text>
<rect x="410" y="75" width="150" height="62" rx="14" fill="#eaf1fd" stroke="#bcd0f1" stroke-width="1.5"/>
<text x="485" y="96" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a91a3">ОСНОВАНИЕ</text>
<text x="485" y="123" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2433">Ca(OH)₂</text>
</g>

<g>
<rect x="20" y="213" width="150" height="62" rx="14" fill="#fdf0e8" stroke="#f0cbb4" stroke-width="1.5"/>
<text x="95" y="234" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a91a3">НЕМЕТАЛЛ</text>
<text x="95" y="261" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2433">S</text>
<rect x="215" y="213" width="150" height="62" rx="14" fill="#fdf0e8" stroke="#f0cbb4" stroke-width="1.5"/>
<text x="290" y="234" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a91a3">КИСЛОТНЫЙ ОКСИД</text>
<text x="290" y="261" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2433">SO₂</text>
<rect x="410" y="213" width="150" height="62" rx="14" fill="#fdf0e8" stroke="#f0cbb4" stroke-width="1.5"/>
<text x="485" y="234" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a91a3">КИСЛОТА</text>
<text x="485" y="261" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2433">H₂SO₃</text>
</g>

<rect x="610" y="144" width="130" height="62" rx="14" fill="#e4f4ee" stroke="#aad8c6" stroke-width="1.5"/>
<text x="675" y="165" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a91a3">СОЛЬ</text>
<text x="675" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2433">CaSO₃</text>

<g fill="none" stroke="#8a91a3" stroke-width="1.5">
<path d="M172 106 H212" marker-end="url(#ar)"/>
<path d="M367 106 H407" marker-end="url(#ar)"/>
<path d="M172 244 H212" marker-end="url(#ar)"/>
<path d="M367 244 H407" marker-end="url(#ar)"/>
<path d="M562 106 H640 Q675 106 675 141" marker-end="url(#ar)"/>
<path d="M562 244 H640 Q675 244 675 209" marker-end="url(#ar)"/>
<path d="M290 140 V210" stroke-dasharray="4 4" marker-start="url(#ar)" marker-end="url(#ar)"/>
<path d="M485 140 V210" stroke-dasharray="4 4" marker-start="url(#ar)" marker-end="url(#ar)"/>
</g>
<g font-size="11.5" fill="#4a5164" text-anchor="middle">
<text x="192" y="98">+O₂</text>
<text x="387" y="98">+H₂O</text>
<text x="192" y="236">+O₂</text>
<text x="387" y="236">+H₂O</text>
<text x="600" y="98">+ кислота</text>
<text x="600" y="262">+ основание</text>
</g>
<g font-size="11.5" fill="#6b7387">
<text x="298" y="172">CaO + SO₂</text>
<text x="298" y="187">→ CaSO₃</text>
<text x="493" y="172">нейтрализация:</text>
<text x="493" y="187">→ соль + H₂O</text>
</g>
<text x="20" y="312" font-size="11.5" fill="#6b7387">Нерастворимые основания — Cu(OH)₂, Fe(OH)₃ — из оксида и воды не получить: их получают из соли и щёлочи.</text>
</svg>
