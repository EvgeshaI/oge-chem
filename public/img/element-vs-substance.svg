<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Химический элемент кислород и вещества, в которых он есть</title>
  <defs>
    <style>
      .ring { fill: none; stroke: #7a5ce0; stroke-width: 2.5; stroke-dasharray: 5 4; }
      .o { fill: #e5484d; stroke: #fff; stroke-width: 2; }
      .ol { fill: #fff; font-weight: 800; text-anchor: middle; font-size: 22px; }
    </style>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2445">Атомы элемента кислорода (O) в разных веществах</text>

  <!-- H2O -->
  <g>
    <circle cx="127" cy="177" r="19" fill="#2f7fec" stroke="#fff" stroke-width="2" />
    <circle cx="173" cy="177" r="19" fill="#2f7fec" stroke="#fff" stroke-width="2" />
    <circle cx="150" cy="148" r="30" class="o" />
    <circle cx="150" cy="148" r="38" class="ring" />
    <text x="150" y="156" class="ol">O</text>
    <text x="127" y="183" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">H</text>
    <text x="173" y="183" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">H</text>
  </g>

  <!-- CO2 -->
  <g>
    <circle cx="450" cy="160" r="25" fill="#3a4056" stroke="#fff" stroke-width="2" />
    <text x="450" y="167" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">C</text>
    <circle cx="396" cy="160" r="29" class="o" />
    <circle cx="396" cy="160" r="37" class="ring" />
    <text x="396" y="168" class="ol">O</text>
    <circle cx="504" cy="160" r="29" class="o" />
    <circle cx="504" cy="160" r="37" class="ring" />
    <text x="504" y="168" class="ol">O</text>
  </g>

  <!-- O2 -->
  <g>
    <circle cx="722" cy="160" r="30" class="o" />
    <rect x="684" y="122" width="132" height="76" rx="38" class="ring" />
    <text x="722" y="168" class="ol">O</text>
    <circle cx="778" cy="160" r="30" class="o" />
    <text x="778" y="168" class="ol">O</text>
  </g>

  <g text-anchor="middle" font-size="14" fill="#6b7387">
    <text x="150" y="80">элемент O входит в состав</text>
    <text x="450" y="80">элемент O входит в состав</text>
    <text x="750" y="80">элемент O образует</text>
  </g>

  <g text-anchor="middle">
    <text x="150" y="246" font-size="18" font-weight="700" fill="#1f2433">H₂O — вода</text>
    <text x="150" y="270" font-size="14" font-weight="700" fill="#d98a0b">сложное вещество</text>
    <text x="450" y="246" font-size="18" font-weight="700" fill="#1f2433">CO₂ — углекислый газ</text>
    <text x="450" y="270" font-size="14" font-weight="700" fill="#d98a0b">сложное вещество</text>
    <text x="750" y="246" font-size="18" font-weight="700" fill="#1f2433">O₂ — кислород</text>
    <text x="750" y="270" font-size="14" font-weight="700" fill="#16a58c">простое вещество</text>
  </g>

  <rect x="40" y="298" width="820" height="46" rx="12" fill="#f1edfc" />
  <text x="450" y="327" text-anchor="middle" font-size="16" fill="#1f2433"><tspan font-weight="800" fill="#7a5ce0">Элемент</tspan> — вид атомов (пунктирные кольца), а <tspan font-weight="800" fill="#16a58c">вещество</tspan> — то, что из них состоит.</text>
</svg>
