<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Карта реакций углерода и кремния. Углерод горит до CO2 или CO, восстанавливает медь, цинк и железо из оксидов, реагирует с водяным паром, углекислым газом и концентрированными азотной и серной кислотами; с металлами даёт карбиды, с водородом — метан, с кремнием — карборунд; не реагирует с разбавленными кислотами, щелочами, хлором и оксидами активных металлов. Кремний при нагревании реагирует с кислородом, хлором и углеродом, со щёлочью и водой даёт силикат и водород, с магнием и кальцием — силициды; с кислотами и водой не реагирует">
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<rect width="760" height="460" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="800" fill="#1f2433">С чем реагируют углерод и кремний</text>
<text x="20" y="50" font-size="12" fill="#6b7387">Оранжевый — восстановитель (с. о. растёт), зелёный — окислитель (с. о. ниже 0), красный — не реагирует</text>
<g stroke-width="4" stroke-linecap="round">
<line x1="190" y1="250" x2="90" y2="132" stroke="#f08c1a"/>
<line x1="190" y1="250" x2="300" y2="132" stroke="#f08c1a"/>
<line x1="190" y1="250" x2="138" y2="250" stroke="#f08c1a"/>
<line x1="190" y1="250" x2="252" y2="240" stroke="#f08c1a"/>
<line x1="190" y1="250" x2="84" y2="330" stroke="#16a58c"/>
<line x1="190" y1="250" x2="300" y2="346" stroke="#e5484d" stroke-dasharray="8 6"/>
</g>
<circle cx="190" cy="250" r="44" fill="#3a4056" stroke="#1b2033" stroke-width="3"/>
<text x="190" y="260" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">C</text>
<g>
<rect x="14" y="70" width="160" height="62" rx="10" fill="#fff0dc"/>
<text x="94" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#a85a00">+ O₂ (горение)</text>
<text x="94" y="107" text-anchor="middle" font-size="11" fill="#1f2433">много O₂ → CO₂</text>
<text x="94" y="123" text-anchor="middle" font-size="11" fill="#1f2433">мало O₂ → CO</text>
</g>
<g>
<rect x="222" y="70" width="168" height="62" rx="10" fill="#fff0dc"/>
<text x="306" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#a85a00">+ CuO, ZnO, Fe₂O₃ (t)</text>
<text x="306" y="107" text-anchor="middle" font-size="11" fill="#1f2433">→ металл + CO</text>
<text x="306" y="123" text-anchor="middle" font-size="11" fill="#1f2433">(выплавка металлов)</text>
</g>
<g>
<rect x="6" y="214" width="132" height="72" rx="10" fill="#fff0dc"/>
<text x="72" y="233" text-anchor="middle" font-size="11.5" font-weight="800" fill="#a85a00">HNO₃, H₂SO₄ (конц.)</text>
<text x="72" y="250" text-anchor="middle" font-size="10.5" fill="#1f2433">→ CO₂ + NO₂ + H₂O</text>
<text x="72" y="266" text-anchor="middle" font-size="10.5" fill="#1f2433">→ CO₂ + SO₂ + H₂O</text>
<text x="72" y="280" text-anchor="middle" font-size="10" fill="#6b7387">при нагревании</text>
</g>
<g>
<rect x="252" y="206" width="136" height="68" rx="10" fill="#fff0dc"/>
<text x="320" y="225" text-anchor="middle" font-size="11.5" font-weight="800" fill="#a85a00">+ H₂O (пар), CO₂</text>
<text x="320" y="242" text-anchor="middle" font-size="11" fill="#1f2433">→ CO + H₂</text>
<text x="320" y="258" text-anchor="middle" font-size="11" fill="#1f2433">→ 2CO (t)</text>
</g>
<g>
<rect x="8" y="320" width="160" height="78" rx="10" fill="#e3f6ef"/>
<text x="88" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#0f7c69">окислитель (t)</text>
<text x="88" y="357" text-anchor="middle" font-size="11" fill="#1f2433">Ca → CaC₂, Al → Al₄C₃</text>
<text x="88" y="373" text-anchor="middle" font-size="11" fill="#1f2433">H₂ → CH₄ (кат.)</text>
<text x="88" y="389" text-anchor="middle" font-size="11" fill="#1f2433">Si → SiC</text>
</g>
<g>
<rect x="212" y="334" width="180" height="94" rx="10" fill="#fde8e8"/>
<text x="302" y="354" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b3282d">не реагирует</text>
<text x="302" y="371" text-anchor="middle" font-size="11" fill="#1f2433">HCl, H₂SO₄ (разб.), NaOH,</text>
<text x="302" y="387" text-anchor="middle" font-size="11" fill="#1f2433">Cl₂, N₂, соли, H₂O (н. у.),</text>
<text x="302" y="403" text-anchor="middle" font-size="11" fill="#1f2433">оксиды Na, Ca, Mg, Al</text>
<text x="302" y="419" text-anchor="middle" font-size="10" fill="#6b7387">(металл углём не получить)</text>
</g>
<line x1="398" y1="70" x2="398" y2="440" stroke="#e1e5f0" stroke-width="2"/>
<g stroke-width="4" stroke-linecap="round">
<line x1="575" y1="250" x2="480" y2="132" stroke="#f08c1a"/>
<line x1="575" y1="250" x2="676" y2="132" stroke="#f08c1a"/>
<line x1="575" y1="250" x2="474" y2="320" stroke="#16a58c"/>
<line x1="575" y1="250" x2="682" y2="320" stroke="#f08c1a"/>
<line x1="575" y1="250" x2="575" y2="396" stroke="#e5484d" stroke-dasharray="8 6"/>
</g>
<circle cx="575" cy="250" r="46" fill="#8ea3c4" stroke="#4f6690" stroke-width="3"/>
<text x="575" y="260" text-anchor="middle" font-size="28" font-weight="800" fill="#14213d">Si</text>
<g>
<rect x="404" y="70" width="152" height="62" rx="10" fill="#fff0dc"/>
<text x="480" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#a85a00">+ O₂, Cl₂ (t)</text>
<text x="480" y="107" text-anchor="middle" font-size="11" fill="#1f2433">→ SiO₂</text>
<text x="480" y="123" text-anchor="middle" font-size="11" fill="#1f2433">→ SiCl₄</text>
</g>
<g>
<rect x="596" y="70" width="158" height="62" rx="10" fill="#fff0dc"/>
<text x="675" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#a85a00">+ NaOH + H₂O</text>
<text x="675" y="107" text-anchor="middle" font-size="11" fill="#1f2433">→ Na₂SiO₃ + H₂↑</text>
<text x="675" y="123" text-anchor="middle" font-size="11" fill="#1f2433">главная реакция!</text>
</g>
<g>
<rect x="404" y="320" width="140" height="62" rx="10" fill="#e3f6ef"/>
<text x="474" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#0f7c69">металлы → силициды</text>
<text x="474" y="357" text-anchor="middle" font-size="11" fill="#1f2433">Mg₂Si, Ca₂Si</text>
<text x="474" y="373" text-anchor="middle" font-size="11" fill="#1f2433">при нагревании</text>
</g>
<g>
<rect x="612" y="320" width="140" height="62" rx="10" fill="#fff0dc"/>
<text x="682" y="340" text-anchor="middle" font-size="12.5" font-weight="800" fill="#a85a00">+ C (t)</text>
<text x="682" y="357" text-anchor="middle" font-size="11" fill="#1f2433">→ SiC</text>
<text x="682" y="373" text-anchor="middle" font-size="11" fill="#1f2433">карборунд</text>
</g>
<g>
<rect x="480" y="396" width="190" height="50" rx="10" fill="#fde8e8"/>
<text x="575" y="414" text-anchor="middle" font-size="11.5" font-weight="800" fill="#b3282d">не реагирует:</text>
<text x="575" y="430" text-anchor="middle" font-size="10.5" fill="#1f2433">HCl, H₂SO₄, HNO₃, H₂O, H₂</text>
<text x="575" y="442" text-anchor="middle" font-size="9.5" fill="#6b7387">(из кислот — только с HF)</text>
</g>
</svg>
