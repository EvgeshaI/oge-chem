<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-label="Кислород и сера — элементы VIA группы, у обоих 6 электронов на внешнем слое. Кислород: степень окисления −2 (реже −1 и +2), в природе — воздух, вода, горные породы; применение — дыхание, медицина, сварка. Сера: степени окисления −2, 0, +4, +6, в природе — самородная сера, сульфиды; применение — серная кислота, резина. От кислорода к сере растут число слоёв, радиус и восстановительные свойства, уменьшаются электроотрицательность, окислительные и неметаллические свойства">
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<rect width="760" height="356" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="700" fill="#1f2433">Кислород и сера — VIA группа</text>
<text x="20" y="50" font-size="12" fill="#6b7387">У обоих атомов 6 электронов на внешнем слое</text>

<g>
<rect x="20" y="66" width="220" height="274" rx="14" fill="#fff4f2" stroke="#f6dcd8" stroke-width="1.5"/>
<text x="130" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Кислород</text>
<circle cx="130" cy="145" r="32" fill="#ff8a8a"/>
<text x="130" y="154" text-anchor="middle" font-size="25" font-weight="700" fill="#4a0f14">O</text>
<text x="130" y="207" text-anchor="middle" font-size="12" fill="#3a4056">электроны: 2, 6</text>
<rect x="40" y="219" width="180" height="24" rx="12" fill="#ffdede"/>
<text x="130" y="235" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a1d22">с. о.: −2 (реже −1, +2)</text>
<text x="36" y="268" font-size="10.5" font-weight="600" fill="#8a91a3">В ПРИРОДЕ</text>
<text x="36" y="284" font-size="11.5" fill="#1f2433">воздух, вода, горные породы</text>
<text x="36" y="308" font-size="10.5" font-weight="600" fill="#8a91a3">ПРИМЕНЕНИЕ</text>
<text x="36" y="324" font-size="11.5" fill="#1f2433">дыхание, медицина, сварка</text>
</g>

<g>
<rect x="255" y="66" width="220" height="274" rx="14" fill="#fffbe6" stroke="#f3e9b4" stroke-width="1.5"/>
<text x="365" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Сера</text>
<circle cx="365" cy="145" r="42" fill="#f7d94c"/>
<text x="365" y="154" text-anchor="middle" font-size="25" font-weight="700" fill="#4a3b00">S</text>
<text x="365" y="207" text-anchor="middle" font-size="12" fill="#3a4056">электроны: 2, 8, 6</text>
<rect x="275" y="219" width="180" height="24" rx="12" fill="#faf0b4"/>
<text x="365" y="235" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5c4d00">с. о.: −2, 0, +4, +6</text>
<text x="271" y="268" font-size="10.5" font-weight="600" fill="#8a91a3">В ПРИРОДЕ</text>
<text x="271" y="284" font-size="11.5" fill="#1f2433">самородная сера, сульфиды</text>
<text x="271" y="308" font-size="10.5" font-weight="600" fill="#8a91a3">ПРИМЕНЕНИЕ</text>
<text x="271" y="324" font-size="11.5" fill="#1f2433">серная кислота, резина</text>
</g>

<g>
<rect x="490" y="66" width="250" height="274" rx="14" fill="#fafbfd" stroke="#e6e9f0" stroke-width="1.5"/>
<text x="508" y="94" font-size="13" font-weight="700" fill="#1f2433">От O к S</text>
<text x="508" y="124" font-size="12.5" fill="#0f7c69">↑ число электронных слоёв</text>
<text x="508" y="149" font-size="12.5" fill="#0f7c69">↑ радиус атома</text>
<text x="508" y="174" font-size="12.5" fill="#0f7c69">↑ восстановительные свойства</text>
<text x="508" y="199" font-size="12.5" fill="#b3282d">↓ электроотрицательность</text>
<text x="508" y="224" font-size="12.5" fill="#b3282d">↓ окислительные свойства</text>
<text x="508" y="249" font-size="12.5" fill="#b3282d">↓ неметаллические свойства</text>
<line x1="508" y1="268" x2="722" y2="268" stroke="#e6e9f0" stroke-width="1.5"/>
<text x="508" y="292" font-size="11.5" fill="#6b7387">Оба — неметаллы.</text>
<text x="508" y="310" font-size="11.5" fill="#6b7387">У серы есть валентности IV и VI,</text>
<text x="508" y="328" font-size="11.5" fill="#6b7387">у кислорода — только II.</text>
</g>
</svg>
