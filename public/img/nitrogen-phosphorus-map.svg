<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Карта реакций азота и фосфора. Азот с водородом даёт аммиак, с литием, магнием и кальцием — нитриды, с кислородом — только NO; с водой, кислотами, щелочами и хлором не реагирует. Фосфор с кислородом даёт P2O3 или P2O5, с хлором — PCl3 или PCl5, с металлами — фосфиды, с концентрированной азотной кислотой — фосфорную кислоту; с водой и разбавленными кислотами не реагирует">
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<rect width="760" height="440" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="800" fill="#1f2433">С чем реагируют азот и фосфор</text>
<text x="20" y="50" font-size="12" fill="#6b7387">Зелёный — окислитель (с. о. −3), оранжевый — восстановитель (с. о. выше 0), красный — не реагирует</text>
<!-- АЗОТ -->
<g stroke-width="4" stroke-linecap="round">
<line x1="190" y1="240" x2="84" y2="110" stroke="#16a58c"/>
<line x1="190" y1="240" x2="300" y2="110" stroke="#16a58c"/>
<line x1="190" y1="240" x2="80" y2="350" stroke="#f08c1a"/>
<line x1="190" y1="240" x2="300" y2="360" stroke="#e5484d" stroke-dasharray="8 6"/>
</g>
<circle cx="190" cy="240" r="44" fill="#9fa8ff" stroke="#5b63c9" stroke-width="3"/>
<text x="190" y="250" text-anchor="middle" font-size="26" font-weight="800" fill="#16205a">N₂</text>
<g>
<rect x="14" y="70" width="150" height="62" rx="10" fill="#e3f6ef"/>
<text x="89" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f7c69">+ H₂ → NH₃</text>
<text x="89" y="107" text-anchor="middle" font-size="11" fill="#1f2433">t, давление,</text>
<text x="89" y="123" text-anchor="middle" font-size="11" fill="#1f2433">катализатор, ⇄</text>
</g>
<g>
<rect x="226" y="70" width="160" height="62" rx="10" fill="#e3f6ef"/>
<text x="306" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f7c69">металлы → нитриды</text>
<text x="306" y="107" text-anchor="middle" font-size="11" fill="#1f2433">Li₃N (без нагревания!)</text>
<text x="306" y="123" text-anchor="middle" font-size="11" fill="#1f2433">Mg₃N₂, Ca₃N₂ (t)</text>
</g>
<g>
<rect x="8" y="320" width="150" height="62" rx="10" fill="#fff0dc"/>
<text x="83" y="340" text-anchor="middle" font-size="12.5" font-weight="800" fill="#a85a00">+ O₂ → только NO</text>
<text x="83" y="357" text-anchor="middle" font-size="11" fill="#1f2433">≈ 2000 °C, молния</text>
<text x="83" y="373" text-anchor="middle" font-size="11" fill="#1f2433">N⁰ → N⁺², ⇄</text>
</g>
<g>
<rect x="226" y="334" width="160" height="78" rx="10" fill="#fde8e8"/>
<text x="306" y="354" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b3282d">не реагирует</text>
<text x="306" y="371" text-anchor="middle" font-size="11" fill="#1f2433">H₂O, HCl, H₂SO₄, NaOH,</text>
<text x="306" y="387" text-anchor="middle" font-size="11" fill="#1f2433">Cl₂, S, C, Cu, Fe, Au,</text>
<text x="306" y="403" text-anchor="middle" font-size="11" fill="#1f2433">благородные газы</text>
</g>
<line x1="398" y1="70" x2="398" y2="420" stroke="#e1e5f0" stroke-width="2"/>
<!-- ФОСФОР -->
<g stroke-width="4" stroke-linecap="round">
<line x1="575" y1="240" x2="470" y2="110" stroke="#f08c1a"/>
<line x1="575" y1="240" x2="680" y2="110" stroke="#f08c1a"/>
<line x1="575" y1="240" x2="470" y2="350" stroke="#16a58c"/>
<line x1="575" y1="240" x2="680" y2="350" stroke="#f08c1a"/>
<line x1="575" y1="240" x2="575" y2="400" stroke="#e5484d" stroke-dasharray="8 6"/>
</g>
<circle cx="575" cy="240" r="44" fill="#f4b183" stroke="#b8702f" stroke-width="3"/>
<text x="575" y="250" text-anchor="middle" font-size="26" font-weight="800" fill="#4a2108">P</text>
<g>
<rect x="404" y="70" width="152" height="62" rx="10" fill="#fff0dc"/>
<text x="480" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#a85a00">+ O₂ (горение)</text>
<text x="480" y="107" text-anchor="middle" font-size="11" fill="#1f2433">мало O₂ → P₂O₃</text>
<text x="480" y="123" text-anchor="middle" font-size="11" fill="#1f2433">много O₂ → P₂O₅</text>
</g>
<g>
<rect x="600" y="70" width="152" height="62" rx="10" fill="#fff0dc"/>
<text x="676" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#a85a00">+ Cl₂, Br₂</text>
<text x="676" y="107" text-anchor="middle" font-size="11" fill="#1f2433">мало Cl₂ → PCl₃</text>
<text x="676" y="123" text-anchor="middle" font-size="11" fill="#1f2433">много Cl₂ → PCl₅</text>
</g>
<g>
<rect x="404" y="320" width="140" height="62" rx="10" fill="#e3f6ef"/>
<text x="474" y="340" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f7c69">металлы → фосфиды</text>
<text x="474" y="357" text-anchor="middle" font-size="11" fill="#1f2433">Ca₃P₂, Mg₃P₂, Na₃P</text>
<text x="474" y="373" text-anchor="middle" font-size="11" fill="#1f2433">при нагревании</text>
</g>
<g>
<rect x="612" y="320" width="140" height="62" rx="10" fill="#fff0dc"/>
<text x="682" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#a85a00">HNO₃ (конц.), KClO₃</text>
<text x="682" y="357" text-anchor="middle" font-size="11" fill="#1f2433">→ H₃PO₄ + NO₂ + H₂O</text>
<text x="682" y="373" text-anchor="middle" font-size="11" fill="#1f2433">→ P₂O₅ + KCl (спичка)</text>
</g>
<g>
<rect x="510" y="398" width="130" height="34" rx="10" fill="#fde8e8"/>
<text x="575" y="414" text-anchor="middle" font-size="11.5" font-weight="800" fill="#b3282d">не реагирует:</text>
<text x="575" y="428" text-anchor="middle" font-size="10.5" fill="#1f2433">H₂O, HCl, H₂SO₄ (разб.)</text>
</g>
</svg>
