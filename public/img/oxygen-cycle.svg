<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Круговорот кислорода: фотосинтез выделяет кислород в атмосферу, дыхание и горение его потребляют">
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<defs>
<marker id="ah-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a58c"/></marker>
<marker id="ah-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5484d"/></marker>
</defs>
<rect width="760" height="380" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="800" fill="#1f2433">Круговорот кислорода в природе</text>
<text x="20" y="50" font-size="12" fill="#6b7387">Зелёная стрелка — O₂ поступает в атмосферу, красная — расходуется</text>
<!-- атмосфера -->
<circle cx="380" cy="160" r="62" fill="#dbe9ff" stroke="#2f7fec" stroke-width="3"/>
<text x="380" y="160" text-anchor="middle" font-size="30" font-weight="800" fill="#1d5bb8">O₂</text>
<text x="380" y="182" text-anchor="middle" font-size="12" fill="#1d5bb8">атмосфера · 21 %</text>
<!-- фотосинтез -->
<rect x="20" y="96" width="230" height="140" rx="14" fill="#e3f6ef" stroke="#9fdcc8" stroke-width="2"/>
<g transform="translate(52 150)">
<rect x="-3" y="10" width="6" height="34" fill="#7a5532"/>
<circle cx="0" cy="0" r="20" fill="#3fbf7f"/>
<circle cx="-14" cy="10" r="13" fill="#2fa86c"/>
<circle cx="14" cy="10" r="13" fill="#2fa86c"/>
</g>
<circle cx="225" cy="114" r="10" fill="#ffd54a"/>
<text x="90" y="124" font-size="14" font-weight="800" fill="#0f7c69">Фотосинтез</text>
<text x="90" y="142" font-size="11" fill="#1f2433">на свету, в зелёных</text>
<text x="90" y="156" font-size="11" fill="#1f2433">растениях</text>
<text x="34" y="206" font-size="11.5" font-weight="700" fill="#1f2433">6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂</text>
<text x="34" y="224" font-size="11" font-weight="800" fill="#0f7c69">выделяет O₂</text>
<line x1="252" y1="160" x2="312" y2="160" stroke="#16a58c" stroke-width="4" marker-end="url(#ah-g)"/>
<!-- дыхание -->
<rect x="510" y="96" width="230" height="140" rx="14" fill="#fdeaea" stroke="#f3b9b9" stroke-width="2"/>
<g transform="translate(546 146)" fill="#c94b4b">
<circle cx="0" cy="-12" r="9"/>
<rect x="-9" y="0" width="18" height="30" rx="7"/>
</g>
<text x="574" y="124" font-size="14" font-weight="800" fill="#b3282d">Дыхание</text>
<text x="574" y="142" font-size="11" fill="#1f2433">медленное окисление</text>
<text x="574" y="156" font-size="11" fill="#1f2433">глюкозы в клетках</text>
<text x="522" y="206" font-size="11.5" font-weight="700" fill="#1f2433">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O</text>
<text x="522" y="224" font-size="11" font-weight="800" fill="#b3282d">потребляет O₂</text>
<line x1="446" y1="160" x2="506" y2="160" stroke="#e5484d" stroke-width="4" marker-end="url(#ah-r)"/>
<!-- горение -->
<rect x="265" y="256" width="230" height="110" rx="14" fill="#fff0de" stroke="#f3cf9c" stroke-width="2"/>
<g transform="translate(300 312)">
<path d="M 0 22 C -16 8 -8 -10 0 -22 C 8 -10 16 8 0 22 Z" fill="#ff9a3c"/>
<path d="M 0 22 C -6 14 -3 4 0 -4 C 3 4 6 14 0 22 Z" fill="#ffe08a"/>
</g>
<text x="330" y="282" font-size="14" font-weight="800" fill="#b8740a">Горение</text>
<text x="330" y="300" font-size="11" fill="#1f2433">топливо, лесные пожары</text>
<text x="330" y="330" font-size="11.5" font-weight="700" fill="#1f2433">CH₄ + 2O₂ → CO₂ + 2H₂O</text>
<text x="330" y="350" font-size="11" font-weight="800" fill="#b3282d">потребляет O₂</text>
<line x1="380" y1="224" x2="380" y2="252" stroke="#e5484d" stroke-width="4" marker-end="url(#ah-r)"/>
<!-- обратная связь: CO₂ -->
<path d="M 600 238 C 600 330 560 350 500 340" fill="none" stroke="#9aa3b8" stroke-width="2.5" stroke-dasharray="6 5"/>
<path d="M 265 330 C 120 340 130 270 135 240" fill="none" stroke="#9aa3b8" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="520" y="372" font-size="11" font-weight="700" fill="#6b7387">CO₂ и H₂O → в атмосферу</text>
<text x="20" y="372" font-size="11" font-weight="700" fill="#6b7387">CO₂ и H₂O → растениям</text>
</svg>
