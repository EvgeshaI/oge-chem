<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Галогены F, Cl, Br, I — VIIA группа, у всех 7 электронов на внешнем слое. Фтор: с. о. −1, газ светло-жёлтый, применение — тефлон, зубная паста. Хлор: с. о. от −1 до +7, газ жёлто-зелёный, обеззараживание воды. Бром: жидкость красно-бурая, лекарства. Иод: твёрдый тёмно-фиолетовый, иодная настойка. Сверху вниз растут число слоёв, радиус, температуры плавления, окраска темнеет; уменьшаются электроотрицательность, окислительная активность и неметаллические свойства">
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<rect width="760" height="430" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="700" fill="#1f2433">Галогены — VIIA группа</text>
<text x="20" y="50" font-size="12" fill="#6b7387">У всех атомов 7 электронов на внешнем слое</text>

<g>
<rect x="20" y="66" width="172" height="274" rx="14" fill="#fbf9ea" stroke="#eee8bf" stroke-width="1.5"/>
<text x="106" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Фтор</text>
<circle cx="106" cy="145" r="28" fill="#f3ecb0"/>
<text x="106" y="153" text-anchor="middle" font-size="23" font-weight="700" fill="#6b6620">F</text>
<text x="106" y="207" text-anchor="middle" font-size="12" fill="#3a4056">электроны: 2, 7</text>
<rect x="34" y="219" width="144" height="24" rx="12" fill="#f3ecb0"/>
<text x="106" y="235" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b6620">с. о.: −1, 0</text>
<text x="34" y="268" font-size="10.5" font-weight="600" fill="#8a91a3">ВЕЩЕСТВО</text>
<text x="34" y="284" font-size="11.5" fill="#1f2433">F₂ — газ, светло-жёлтый</text>
<text x="34" y="308" font-size="10.5" font-weight="600" fill="#8a91a3">ПРИМЕНЕНИЕ</text>
<text x="34" y="324" font-size="11.5" fill="#1f2433">тефлон, зубная паста</text>
</g>

<g>
<rect x="201" y="66" width="172" height="274" rx="14" fill="#f6faea" stroke="#e1ecbf" stroke-width="1.5"/>
<text x="287" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Хлор</text>
<circle cx="287" cy="145" r="34" fill="#cfe56a"/>
<text x="287" y="153" text-anchor="middle" font-size="23" font-weight="700" fill="#44570a">Cl</text>
<text x="287" y="207" text-anchor="middle" font-size="12" fill="#3a4056">электроны: 2, 8, 7</text>
<rect x="215" y="219" width="144" height="24" rx="12" fill="#e3f0a8"/>
<text x="287" y="235" text-anchor="middle" font-size="11.5" font-weight="600" fill="#44570a">с. о.: от −1 до +7</text>
<text x="215" y="268" font-size="10.5" font-weight="600" fill="#8a91a3">ВЕЩЕСТВО</text>
<text x="215" y="284" font-size="11.5" fill="#1f2433">Cl₂ — газ, жёлто-зелёный</text>
<text x="215" y="308" font-size="10.5" font-weight="600" fill="#8a91a3">ПРИМЕНЕНИЕ</text>
<text x="215" y="324" font-size="11.5" fill="#1f2433">обеззараживание воды</text>
</g>

<g>
<rect x="382" y="66" width="172" height="274" rx="14" fill="#fdf2ec" stroke="#f3d8ca" stroke-width="1.5"/>
<text x="468" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Бром</text>
<circle cx="468" cy="145" r="38" fill="#e9946a"/>
<text x="468" y="153" text-anchor="middle" font-size="23" font-weight="700" fill="#5a1d08">Br</text>
<text x="468" y="207" text-anchor="middle" font-size="12" fill="#3a4056">электроны: 2, 8, 18, 7</text>
<rect x="396" y="219" width="144" height="24" rx="12" fill="#f6cdb8"/>
<text x="468" y="235" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5a1d08">с. о.: от −1 до +7</text>
<text x="396" y="268" font-size="10.5" font-weight="600" fill="#8a91a3">ВЕЩЕСТВО</text>
<text x="396" y="284" font-size="11.5" fill="#1f2433">Br₂ — жидкость, бурая</text>
<text x="396" y="308" font-size="10.5" font-weight="600" fill="#8a91a3">ПРИМЕНЕНИЕ</text>
<text x="396" y="324" font-size="11.5" fill="#1f2433">лекарства, красители</text>
</g>

<g>
<rect x="563" y="66" width="177" height="274" rx="14" fill="#f7f1fc" stroke="#e5d7f2" stroke-width="1.5"/>
<text x="651" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Иод</text>
<circle cx="651" cy="145" r="42" fill="#c9a6e6"/>
<text x="651" y="153" text-anchor="middle" font-size="23" font-weight="700" fill="#47206b">I</text>
<text x="651" y="207" text-anchor="middle" font-size="12" fill="#3a4056">электроны: 2, 8, 18, 18, 7</text>
<rect x="579" y="219" width="144" height="24" rx="12" fill="#e4d2f3"/>
<text x="651" y="235" text-anchor="middle" font-size="11.5" font-weight="600" fill="#47206b">с. о.: от −1 до +7</text>
<text x="577" y="268" font-size="10.5" font-weight="600" fill="#8a91a3">ВЕЩЕСТВО</text>
<text x="577" y="284" font-size="11.5" fill="#1f2433">I₂ — твёрдый, фиолетовый</text>
<text x="577" y="308" font-size="10.5" font-weight="600" fill="#8a91a3">ПРИМЕНЕНИЕ</text>
<text x="577" y="324" font-size="11.5" fill="#1f2433">иодная настойка</text>
</g>

<g>
<rect x="20" y="354" width="720" height="66" rx="14" fill="#fafbfd" stroke="#e6e9f0" stroke-width="1.5"/>
<text x="38" y="380" font-size="12.5" fill="#1f2433"><tspan font-weight="700">Сверху вниз (F → I):</tspan><tspan fill="#0f7c69">  ↑ число слоёв · радиус атома · температура плавления · окраска темнее</tspan></text>
<text x="38" y="404" font-size="12.5" fill="#b3282d"><tspan fill="#1f2433" font-weight="700" visibility="hidden">Сверху вниз (F → I):</tspan>  ↓ электроотрицательность · окислительная активность · неметаллические свойства</text>
</g>
</svg>
