<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Галогены F, Cl, Br, I: размер атома, электроотрицательность, агрегатное состояние. Сверху вниз по группе радиус растёт, электроотрицательность и окислительная активность падают">
